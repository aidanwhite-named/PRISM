<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>PRISM</title>
  <!-- The asymmetric tile echoes PRISM's report cards. -->
  <path
    d="M21 3h22c10 0 18 8 18 18v22c0 10-8 18-18 18H13C7.5 61 3 56.5 3 51V21C3 11 11 3 21 3Z"
    fill="#234f5c"
