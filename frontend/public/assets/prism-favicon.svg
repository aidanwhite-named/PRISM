    d="M21 4h22c9.4 0 17 7.6 17 17v22c0 9.4-7.6 17-17 17H13c-5 0-9-4-9-9V21C4 11.6 11.6 4 21 4Z"
    fill="none"
    stroke="#173d48"
    stroke-width="2"
  />

  <!-- One input enters the prism and leaves separated: the same move the report makes. -->
  <path
